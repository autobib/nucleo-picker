[package]
name = "nucleo-picker-core"
version = "0.2.0"
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
serde = ["dep:serde"]
preview-ansi = ["dep:anstyle-parse"]
ratatui = ["dep:ratatui-core"]
crossterm = ["dep:crossterm"]

[dependencies]
anstyle-parse = { version = "1.0", optional = true }
crossterm = { workspace = true, optional = true, default-features = false }
memchr = "2.7"
nucleo = { version = "0.4.2", package = "ncp-engine" }
ratatui-core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
ignore.workspace = true
ratatui-widgets.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
