[package]
name = "nucleo-picker-core"
version = "0.1.0-beta.10"
description.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
serde = ["dep:serde"]
preview-ansi = ["dep:anstyle-parse"]
ratatui = ["dep:ratatui-core"]
crossterm = ["dep:crossterm"]

[dependencies]
anstyle-parse = { version = "1.0", optional = true }
crossterm = { version = "0.29.0", optional = true, default-features = false }
memchr = "2.7"
nucleo = { version = "0.4.0", package = "ncp-engine" }
ratatui-core = { workspace = true, optional = true }
serde = { version = "1.0", optional = true }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[dev-dependencies]
ignore = "0.4"
ratatui-widgets = { version = "0.3.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
