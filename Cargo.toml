[package]
authors.workspace = true
categories = ["command-line-interface"]
description = "A performant and Unicode-aware fuzzy picker tui library"
edition.workspace = true
keywords = ["cli"]
license.workspace = true
name = "nucleo-picker"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.13.0"

[workspace]
default-members = [".", "nucleo-picker-core", "nucleo-picker-interface"]
members = ["nucleo-picker-core", "nucleo-picker-interface", "nucleo-picker-vt"]
resolver = "3"

[workspace.package]
authors = ["Alex Rutar <alex@rutar.org>"]
repository = "https://github.com/autobib/nucleo-picker"
description = "A performant and Unicode-aware fuzzy picker tui library"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
nucleo-picker = { path = ".", version = "0.13.0" }
nucleo-picker-core = { path = "nucleo-picker-core", version = "0.1.0" }
nucleo-picker-interface = { path = "nucleo-picker-interface", version = "0.1.0" }
crossterm = "0.29.0"
parking_lot = "0.13.0"
ratatui-core = { version = "0.1.2", default-features = false, features = ["underline-color"] }
unicode-segmentation = "1.12.0"
unicode-width = { version = "0.2.3", default-features = false }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["unix-poll"]
# enabled to fix macOS polling which breaks non-interactive STDIN
unix-poll = ["crossterm/use-dev-tty"]
# expose 'custom backend' traits
# unstable and subject to change on every version bump
unstable-backend = []
serde = ["nucleo-picker-core/serde"]
preview-cache = ["nucleo-picker-interface/preview-cache"]
preview-ansi = ["nucleo-picker-core/preview-ansi"]
ratatui = ["nucleo-picker-core/ratatui"]

[dependencies]
crossterm.workspace = true
nucleo-picker-core = { workspace = true, features = ["crossterm"] }
nucleo-picker-interface.workspace = true
parking_lot.workspace = true

[dev-dependencies]
crossbeam = "0.8.4"
ignore = "0.4"
rand = "0.10.2"
ratatui-core.workspace = true
ratatui-crossterm = "0.1.2"
ratatui-widgets = { version = "0.3.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[lints]
workspace = true

[workspace.lints.clippy]
redundant_closure_for_method_calls = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

[[example]]
name = "custom_io"

[[example]]
name = "fzf_basic"

[[example]]
name = "fzf_err_handling"

[[example]]
name = "find"

[[example]]
name = "find_preview"
required-features = ["preview-cache"]

[[example]]
name = "find_preview_full"
required-features = ["preview-cache"]

[[example]]
name = "restart"

[[example]]
name = "restart_ext"

[[example]]
name = "blocking"

[[example]]
name = "multi"

[[example]]
name = "serde"
required-features = ["serde"]

[[example]]
name = "preview"
required-features = ["preview-cache"]

[[example]]
name = "preview_uncached"

[[example]]
name = "preview_style"
required-features = ["preview-cache"]

[[example]]
name = "preview_single"
required-features = ["preview-cache"]

[[example]]
name = "preview_serde"
required-features = ["serde", "preview-cache"]

[[example]]
name = "online_preview"
required-features = ["preview-cache"]

[[example]]
name = "options"

[[example]]
name = "timeout"

[[example]]
name = "low_framerate"

[[example]]
name = "ratatui"
required-features = ["ratatui"]
