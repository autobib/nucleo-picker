[package]
edition.workspace = true
name = "nucleo-picker-vt"
publish = false
rust-version.workspace = true
version = "0.0.0"

[features]
preview-cache = ["nucleo-picker/preview-cache"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm.workspace = true
libghostty-vt = "=0.2.1"
nucleo-picker = { workspace = true, features = ["unstable-backend"] }
oneshot = { version = "0.2.1", features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml_ng = "0.10.0"
unicode-segmentation.workspace = true
unicode-width.workspace = true
xml = "1.4.0"

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }

[lints]
workspace = true
