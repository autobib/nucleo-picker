[package]
edition.workspace = true
name = "nucleo-picker-vt"
publish = false
rust-version.workspace = true
version = "0.0.0"

[features]
preview-cache = ["nucleo-picker/preview-cache"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
libghostty-vt = "=0.2.1"
nucleo-picker = { workspace = true, features = ["unstable-backend"] }
oneshot = { version = "0.2.1", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
unicode-segmentation = "1.12.0"
unicode-width = { version = "0.2.2", default-features = false }
xml = "1.4.0"

[dev-dependencies]
insta = { version = "1.48.0", features = ["yaml"] }

[lints]
workspace = true
